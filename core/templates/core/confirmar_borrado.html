{% extends "base.html" %}

{% block titulo %}Confirmar borrado{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card shadow-sm border-danger">
      <div class="card-body">
        <h1 class="h4 mb-3">Confirmar borrado</h1>
        <p>¿Seguro que querés borrar <strong>{{ object }}</strong>? Esta acción no se puede deshacer.</p>
        <form method="post">
          {% csrf_token %}
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> Borrar</button>
            <a href="{{ cancelar_url }}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
